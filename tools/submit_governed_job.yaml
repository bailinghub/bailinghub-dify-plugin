identity:
  name: submit_governed_job
  author: niejingchuan
  label:
    en_US: Submit Governed Job
    zh_Hans: 提交受治理任务
  icon: icon.svg

description:
  human:
    en_US: Submit a business action to BailingHub instead of calling the business API directly.
    zh_Hans: 将业务操作提交给 BailingHub，而不是由 Dify 直接调用业务 API。
  llm: >-
    Submit an action to a configured BailingHub route. Use this tool for business-system
    operations that must pass BailingHub routing, subject, risk, approval, and audit controls.
    Never invent a route, change the request on retry, or include credentials in the input.

parameters:
  - name: request_id
    type: string
    required: true
    form: llm
    label:
      en_US: Request ID
      zh_Hans: 请求标识
    human_description:
      en_US: A stable idempotency key for this exact business request.
      zh_Hans: 此项业务请求的稳定幂等标识。
    llm_description: >-
      A unique, stable idempotency key for this exact business request. Reuse it only when
      retrying the same request with the same meaning and arguments. Prefer a deterministic
      value generated by the workflow rather than a value invented by the model.
  - name: route
    type: string
    required: true
    form: form
    label:
      en_US: Governed Route
      zh_Hans: 治理路由
    human_description:
      en_US: A BailingHub route explicitly configured for this workflow.
      zh_Hans: 已为当前工作流明确配置的 BailingHub 路由。
  - name: input
    type: string
    required: true
    form: llm
    label:
      en_US: Business Request
      zh_Hans: 业务请求
    human_description:
      en_US: The business instruction to be governed and executed.
      zh_Hans: 需要接受治理并执行的业务指令。
    llm_description: >-
      The complete business instruction. Do not include BailingHub tokens, business-system
      credentials, acting-subject credentials, or other secrets.

extra:
  python:
    source: tools/submit_governed_job.py

output_schema:
  type: object
  properties:
    job_id:
      type: string
      description: BailingHub job UUID used for subsequent status checks.
    request_id:
      type: string
      description: The accepted client-scoped idempotency key.
    status:
      type: string
      description: Current job status.
    terminal:
      type: boolean
      description: Whether the job reached a terminal status.
    route:
      type: string
      description: The BailingHub route selected for the job.
    target:
      type: string
      description: The resolved BailingHub target, when returned.
