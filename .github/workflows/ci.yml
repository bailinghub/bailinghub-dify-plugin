name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/check_project.py
      - name: Check current BailingHub Client API contract
        env:
          BAILING_CLIENT_API_CORE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/bailinghub/bailinghub.git "$BAILING_CLIENT_API_CORE_REF" >/dev/null 2>&1; then
            git clone --depth 1 --branch "$BAILING_CLIENT_API_CORE_REF" https://github.com/bailinghub/bailinghub.git /tmp/bailinghub-core
          else
            git clone --depth 1 https://github.com/bailinghub/bailinghub.git /tmp/bailinghub-core
          fi
          uv run python scripts/check_client_api_contract.py \
            --contract-dir /tmp/bailinghub-core/contracts/client-api/v1
      - name: Package with the pinned Dify Plugin CLI
        env:
          DIFY_PLUGIN_CLI_VERSION: 0.6.5
        run: |
          curl --fail --location --silent --show-error \
            --output /tmp/dify \
            "https://github.com/langgenius/dify-plugin-daemon/releases/download/${DIFY_PLUGIN_CLI_VERSION}/dify-plugin-linux-amd64"
          chmod +x /tmp/dify
          mkdir -p dist
          /tmp/dify plugin package . --output_path dist/bailinghub.difypkg
          test -s dist/bailinghub.difypkg
      - run: uv run python scripts/check_package.py dist/bailinghub.difypkg
      - name: Upload audited plugin package
        uses: actions/upload-artifact@v4
        with:
          name: bailinghub-dify-plugin
          path: dist/bailinghub.difypkg
          if-no-files-found: error
