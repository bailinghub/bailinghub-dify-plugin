[project]
name = "bailinghub-dify-plugin"
version = "0.1.2"
description = "Dify Tool Plugin for a self-hosted BailingHub control plane"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "dify_plugin>=0.9.0,<1.0.0",
  "requests>=2.34.2,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0,<9.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "ruff>=0.12.0,<1.0.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
